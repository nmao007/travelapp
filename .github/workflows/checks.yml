name: App checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # The deployed app lives in site/; its tests and the Vercel build must pass too.
      - run: npm test
        working-directory: site
      - run: node --disable-warning=ExperimentalWarning scripts/build-vercel.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-check-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - run: npm run typecheck
      # The native app (Expo) keeps its own dependencies.
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile
