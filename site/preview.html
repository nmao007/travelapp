  <script>
    // Actual phones open the application directly: their browser owns the safe
    // areas, keyboard and scrolling, without a nested preview viewport.
    if (matchMedia('(pointer:coarse)').matches && matchMedia('(max-width:580px), (max-width:980px) and (max-height:500px)').matches) {

      location.replace('/app' + (nativeQuery.size ? '?' + nativeQuery : ''));
    }

  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#fff;font:13px 'DM Sans',Arial,sans-serif}
    .stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
    .device-wrap,.device{width:100%;height:100%}.device{position:relative}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .phone-status,.home-indicator,.hardware-controls{display:none}
    .stage.phone{padding:32px 24px}
    .stage.phone .device-wrap{width:calc(var(--phone-body-width,432.554px) * var(--phone-scale,1));height:calc(var(--phone-body-height,891.557px) * var(--phone-scale,1));position:relative;flex:none;filter:drop-shadow(0 5px 10px #16131940) drop-shadow(0 18px 28px #16131960)}
    .stage.phone .device{width:var(--phone-body-width,432.554px);height:var(--phone-body-height,891.557px);background:#383837;clip-path:url(#phone-body-outline);transform:scale(var(--phone-scale,1));transform-origin:top left}
    .hardware-outline{display:none;position:absolute;inset:0;pointer-events:none}
    .stage.phone .hardware-outline{display:block;width:100%;height:100%}
    .stage.phone iframe{position:absolute;left:19.777px;top:19.7785px;width:var(--phone-width,393px);height:var(--phone-height,852px);clip-path:url(#phone-screen-outline)}
    .stage.phone .phone-status{display:grid;grid-template-columns:1fr var(--cutout-width,124.941px) 1fr;position:absolute;top:19.7785px;left:19.777px;width:var(--phone-width,393px);height:var(--phone-safe-top,62px);align-items:center;padding:0;pointer-events:none;color:#000;font:600 17px/22px -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
    #phone-time{grid-column:1;text-align:center;width:100%}
    .phone-status .island{position:absolute;top:11.291px;left:50%;transform:translateX(-50%);width:124.941px;height:36.655px;border-radius:24px;background:#000}
    .status-symbols{grid-column:3;justify-self:center;display:flex;align-items:center;gap:7px;height:22px}
    .status-symbol{display:block;position:relative;width:18px;height:12px;overflow:hidden;flex:none}
    .status-symbol img{display:block;position:absolute;max-width:none}
    /* Fit the visible SF glyph, excluding the transparent export margins. */
    .status-symbol.cellular img{width:21.296px;height:14.571px;left:-1.521px;top:-1.429px}
    .status-symbol.wifi{width:17px}.status-symbol.wifi img{width:20.036px;height:14.233px;left:-1.214px;top:-1.116px}
    .status-symbol.battery{width:27px;height:13px}.status-symbol.battery img{width:31.974px;height:16.545px;left:-2.132px;top:-1.970px}
    .stage.phone .home-indicator{display:block;position:absolute;top:calc(var(--phone-height,852px) + 6.7785px);left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#000;pointer-events:none;opacity:1;transition:opacity .35s ease}
    .stage.phone .home-indicator.is-idle{opacity:0}
    /* Front projection of Apple's dimensions, scaled at 852 / 141.09 px/mm.

    .stage.phone .hardware-controls{display:block;position:absolute;inset:0;width:var(--phone-body-width,432.554px);height:var(--phone-body-height,891.557px);transform:scale(var(--phone-scale,1));transform-origin:top left;pointer-events:none;z-index:2}
    .hardware-button{position:absolute;width:2.717px;background:#636362;border:solid #383837;border-width:1px 0;box-shadow:inset 1px 0 #999995;border-radius:1px}
    .hardware-button.action{left:-2.717px;top:184.965px;height:41.667px}
    .hardware-button.volume-up{left:-2.717px;top:257.430px;height:67.633px}
    .hardware-button.volume-down{left:-2.717px;top:343.179px;height:67.633px}
    .hardware-button.side{right:-2.717px;top:280.679px;height:106.885px;box-shadow:inset -1px 0 #999995}
    .hardware-button.camera{right:0;top:529.473px;height:103.262px;width:1.5px;background:#787876;box-shadow:none}
    .stage.phone .device,.stage.phone .device *{cursor:none!important}
    .phone-finger{position:fixed;left:0;top:0;width:calc(60px * var(--phone-scale,1));height:calc(60px * var(--phone-scale,1));border-radius:50%;border:2px solid #fff;background:#20201f24;box-shadow:0 0 0 1px #20201f70,0 2px 8px #20201f25;translate:-50% -50%;pointer-events:none;z-index:1000;transition:transform .12s ease,background .12s ease}
    .phone-finger.pressed{transform:scale(1.08);background:#ff5b2470}
    .phone-finger[hidden]{display:none}
    #switch{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:100;display:grid;place-items:center;width:44px;height:44px;min-height:44px;min-width:44px;padding:0;border:1px solid var(--accent);background:var(--accent);color:var(--ink);box-shadow:0 3px 12px #16131922;cursor:pointer;transition:background .18s,box-shadow .18s}
    #switch:hover{background:var(--accent-hover);box-shadow:0 5px 16px #16131930}#switch:active{box-shadow:0 1px 4px #16131920}#switch:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
    #switch svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}#switch .desktop-icon{display:none}#switch[data-phone=true] .desktop-icon{display:block}#switch[data-phone=true] .phone-icon{display:none}
    @media(prefers-reduced-motion:reduce){#switch,.phone-finger,.stage.phone .home-indicator{transition:none}}
    .stage.phone[data-cutout=notch] .island{top:-2px;width:155px;height:34px;border-radius:0 0 20px 20px;background:#050505}
    .stage.phone[data-cutout=notch] .phone-status{font-size:16px}
    .stage.phone[data-cutout=notch] .status-symbols{gap:5px}
    #phone-model-button{position:fixed;left:16px;bottom:12px;z-index:100;display:none;place-items:center;width:44px;height:44px;border:1px solid var(--line);background:white;color:var(--ink);box-shadow:0 3px 12px #16131918}
    #phone-model-button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
    body:has(.stage.phone) #phone-model-button{display:grid}
    #phone-model-menu{position:fixed;inset:auto auto 64px 16px;margin:0;width:230px;max-height:min(480px,calc(100dvh - 100px));overflow:auto;padding:6px;border:1px solid var(--line);background:white;box-shadow:var(--popover-shadow);overscroll-behavior:contain}
    #phone-model-menu button{display:block;width:100%;min-height:44px;padding:10px 12px;text-align:left;font:500 14px 'DM Sans',sans-serif;color:var(--ink)}
    #phone-model-menu button:hover,#phone-model-menu button[aria-pressed=true]{background:var(--tint);color:var(--action)}
    #phone-model-menu:popover-open{animation:models-in .18s ease both}
    @keyframes models-in{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
    @media(prefers-reduced-motion:reduce){#phone-model-menu:popover-open{animation:none}}
  </style>

  <button class="switch" id="switch" type="button" aria-label="Switch to iPhone layout" title="iPhone view · Option + Shift + M"><svg class="phone-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg><svg class="desktop-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="1"/><path d="M8 21h8m-4-4v4"/></svg></button>
  <button id="phone-model-button" type="button" aria-label="Choose iPhone model" popovertarget="phone-model-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 5h4M11 18h2"/></svg></button>
  <div id="phone-model-menu" popover aria-label="iPhone models"></div>
  <div class="phone-finger" id="phone-finger" aria-hidden="true" hidden></div>
  <script type="module">
    import { phoneDevices, phoneDevice } from "/phone-devices.js";
    const stage=document.getElementById('stage'),button=document.getElementById('switch'),frame=stage.querySelector('iframe');
    const query=new URLSearchParams(location.search),initialPhone=Boolean(query.get('device'));let selectedDevice=phoneDevice(query.get('device'));query.delete('device');
    frame.src='/app' + (query.size?'?'+query:'');
    function fitPhone(){const scale=Math.min(1,(innerWidth-48)/(selectedDevice.width+39.554),(innerHeight-64)/(selectedDevice.height+39.557));document.documentElement.style.setProperty('--phone-scale',Math.max(.2,scale));}
    const modelMenu=document.getElementById('phone-model-menu');
    const bodyPath=document.querySelector('#phone-body-outline path'),screenPath=document.querySelector('#phone-screen-outline path');
    const originalBodyPath=bodyPath.getAttribute('d'),originalScreenPath=screenPath.getAttribute('d');
    function configurePhone(){
      const root=document.documentElement, d=selectedDevice;
      for(const [name,value] of Object.entries({'phone-width':d.width,'phone-height':d.height,'phone-body-width':d.width+39.554,'phone-body-height':d.height+39.557,'phone-safe-top':d.safeTop,'cutout-width':d.cutout==='notch'?155:124.941}))root.style.setProperty('--'+name,value+'px');
      stage.dataset.cutout=d.cutout;
      bodyPath.setAttribute('d',originalBodyPath);bodyPath.setAttribute('transform',`scale(${(d.width+39.554)/432.554} ${(d.height+39.557)/891.557})`);
      screenPath.setAttribute('d',originalScreenPath);screenPath.setAttribute('transform',`scale(${d.width/393} ${d.height/852})`);
      stage.querySelector('.hardware-button.camera').hidden=!/^iphone1[678](?!e)|iphoneair/.test(d.id);
      stage.querySelector('.hardware-button.action').style.height=/^iphone1[34]|iphone15(?!pro)/.test(d.id)?'26px':'41.667px';
      for(const row of modelMenu.querySelectorAll('button'))row.setAttribute('aria-pressed',String(row.dataset.device===d.id));
      fitPhone();syncDevice();
    }
    for(const d of phoneDevices){const row=document.createElement('button');row.type='button';row.textContent=d.name;row.dataset.device=d.id;row.setAttribute('aria-pressed',String(d.id===selectedDevice.id));row.addEventListener('click',()=>{selectedDevice=d;modelMenu.hidePopover();configurePhone();toggle(true);});modelMenu.append(row);}
    modelMenu.addEventListener('toggle',()=>{if(modelMenu.matches(':popover-open'))modelMenu.querySelector('[aria-pressed=true]')?.scrollIntoView({block:'nearest'});});
    const finger=document.getElementById('phone-finger'),boundDocuments=new WeakSet();
    const homeIndicator=stage.querySelector('.home-indicator');let indicatorTimer;
    function wakeHomeIndicator(){
      clearTimeout(indicatorTimer);homeIndicator.classList.remove('is-idle');
      if(stage.classList.contains('phone'))indicatorTimer=setTimeout(()=>homeIndicator.classList.add('is-idle'),3000);
    }
    function onPhoneInteraction(event){
      if(stage.classList.contains('phone')&&(event.type!=='pointermove'||event.buttons))wakeHomeIndicator();
    }
    function hideFinger(){finger.hidden=true;finger.classList.remove('pressed');}
    function trackFinger(event,embedded=false){
      if(!stage.classList.contains('phone')||event.pointerType!=='mouse'){hideFinger();return;}
      if(!embedded&&!event.target.closest('.device')){hideFinger();return;}
      const rect=frame.getBoundingClientRect();
      finger.style.left=(embedded?rect.left+event.clientX*rect.width/frame.clientWidth:event.clientX)+'px';
      finger.style.top=(embedded?rect.top+event.clientY*rect.height/frame.clientHeight:event.clientY)+'px';
      finger.classList.toggle('pressed',Boolean(event.buttons&1));finger.hidden=false;
    }
    function syncDevice(){
      const doc=frame.contentDocument;if(!doc)return;
      const phone=stage.classList.contains('phone');doc.documentElement.dataset.devicePreview=phone?selectedDevice.id:'';
      doc.documentElement.style.setProperty('--preview-safe-top',selectedDevice.safeTop+'px');doc.documentElement.style.setProperty('--preview-safe-bottom',selectedDevice.safeBottom+'px');
      if(!phone)hideFinger();
      if(boundDocuments.has(doc))return;boundDocuments.add(doc);
      for(const type of ['pointermove','pointerdown','pointerup'])doc.defaultView.addEventListener(type,event=>trackFinger(event,true),true);
      for(const type of ['pointerdown','pointerup','pointermove','wheel','keydown'])doc.defaultView.addEventListener(type,onPhoneInteraction,{capture:true,passive:true});
      doc.addEventListener('pointerleave',hideFinger);doc.defaultView.addEventListener('pointercancel',hideFinger,true);
    }
    for(const type of ['pointermove','pointerdown','pointerup'])document.addEventListener(type,event=>trackFinger(event),true);
    document.documentElement.addEventListener('pointerleave',hideFinger);window.addEventListener('blur',hideFinger);
    function toggle(force){const phone=typeof force==='boolean'?force:!stage.classList.contains('phone');stage.classList.toggle('phone',phone);button.dataset.phone=String(phone);button.setAttribute('aria-label',phone?'Switch to desktop layout':'Switch to iPhone layout');button.title=(phone?'Desktop view':'iPhone view')+' · Option + Shift + M';frame.title=phone?'TripPilot — '+selectedDevice.name+' full screen':'TripPilot website';const url=new URL(location.href);if(phone)url.searchParams.set('device',selectedDevice.id);else url.searchParams.delete('device');history.replaceState(null,'',url);fitPhone();syncDevice();if(!phone&&modelMenu.matches(':popover-open'))modelMenu.hidePopover();wakeHomeIndicator();}
    function updateTime(){document.getElementById('phone-time').textContent=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',hour12:true}).formatToParts(new Date()).filter(part=>part.type!=='dayPeriod').map(part=>part.value).join('').trim();}
    frame.addEventListener('load',()=>{syncDevice();wakeHomeIndicator();});button.addEventListener('click',()=>toggle());window.addEventListener('resize',fitPhone);
    document.addEventListener('keydown',event=>{if(event.altKey&&event.shiftKey&&event.code==='KeyM'){event.preventDefault();toggle();}});
    window.addEventListener('message',event=>{
      if(event.source!==frame.contentWindow||event.origin!==location.origin)return;
      if(event.data==='trippilot-toggle-preview')toggle();
      if(event.data?.type==='trippilot-navigation'){
        const url=new URL(location.href);
        if(typeof event.data.tripId==='string')url.searchParams.set('trip',event.data.tripId);else url.searchParams.delete('trip');
        history.replaceState(null,'',url);
      }
    });
    configurePhone();updateTime();setInterval(updateTime,60000);toggle(initialPhone);
  </script>
