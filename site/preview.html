<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripPilot preview</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#fff;font:13px 'DM Sans',Arial,sans-serif}.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:auto}.stage iframe{display:block;width:100%;height:100%;border:0;background:#fff;transition:width .32s cubic-bezier(.2,.8,.2,1),height .32s cubic-bezier(.2,.8,.2,1),box-shadow .32s}.stage.phone{display:block;overflow:auto;padding:20px 0;background:#fff;text-align:center}.stage.phone iframe{width:393px;height:852px;max-width:100vw;margin:0 auto;border:0;outline:1px solid #11100f;border-radius:0;box-shadow:12px 14px 0 #11100f}.switch{position:fixed;right:20px;bottom:20px;z-index:10;display:flex;align-items:center;gap:9px;padding:12px 15px;border:1px solid #ff5b24;border-radius:0;background:#ff5b24;color:#20201f;box-shadow:0 3px 12px #16131922;cursor:pointer;font-weight:800;transition:transform .2s,box-shadow .2s}.switch:hover{background:#e34c19;box-shadow:0 5px 16px #ff5b2422}.switch svg{width:18px;height:18px;fill:none;stroke:#20201f;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}@media(prefers-reduced-motion:reduce){.stage iframe,.switch{transition:none}}.switch kbd{padding:3px 5px;border:1px solid #ffffff50;background:#ffffff20;color:#fff;font:11px Arial,sans-serif}@media(max-width:600px){.stage.phone iframe{border-radius:0}.switch{right:12px;bottom:12px}}
  </style>
</head>
<body>
  <div class="stage" id="stage"><iframe src="/" title="TripPilot website"></iframe></div>
  <button class="switch" id="switch" type="button" aria-label="Switch to iPhone layout" title="Option + Shift + M"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg><span id="switch-label">iPhone view</span></button>
  <script>
    const stage=document.getElementById('stage'),button=document.getElementById('switch'),label=document.getElementById('switch-label');
    stage.querySelector('iframe').src='/' + location.search;
    function toggle(){const phone=stage.classList.toggle('phone');label.textContent=phone?'Desktop view':'iPhone view';button.setAttribute('aria-label',phone?'Switch to desktop layout':'Switch to iPhone layout');}
    button.addEventListener('click',toggle);
    document.addEventListener('keydown',event=>{if(event.altKey&&event.shiftKey&&event.code==='KeyM'){event.preventDefault();toggle();}});
    window.addEventListener('message',event=>{if(event.origin===location.origin&&event.data==='trippilot-toggle-preview')toggle();});
  </script>
</body>
</html>
