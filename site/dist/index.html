<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Find a place. Make the trip yours.">
  <title>TripPilot — Go somewhere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='0' fill='%23ff5b24'/%3E%3Cpath d='m12 42 40-28-14 36-6-17-20 9Z' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 10h18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2V5Zm6-2v16m6-14v16"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-plane" viewBox="0 0 24 24"><path d="M22 2 9 15m13-13-7 20-4-9-9-4L22 2Z"/></symbol>
    <symbol id="i-train" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="16" rx="4"/><path d="M5 10h14M8 18l-3 4m11-4 3 4M8 6h8"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L21 7a2 2 0 0 0-4-4L5 15l-1 5Z"/></symbol>
    <symbol id="i-food" viewBox="0 0 24 24"><path d="M4 3v5a3 3 0 0 0 6 0V3M7 3v18M20 21V3c-4 2-5 6-5 10h5"/></symbol>
    <symbol id="i-stay" viewBox="0 0 24 24"><path d="M3 18h18M3 7v14m18-14v14M3 15h18v-5H10v5M3 8h7v7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>

    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 5h12M9 12h12M9 19h12M3 5h1M3 12h1M3 19h1"/></symbol>
    <symbol id="i-day" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 9h18M8 13h8M8 17h5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7m0-7L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 3h4l2 5-3 2a14 14 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2C9 21 3 15 3 5a2 2 0 0 1 2-2Z"/></symbol>
    <symbol id="i-directions" viewBox="0 0 24 24"><path d="m12 2 10 10-10 10L2 12 12 2Z"/><path d="M8 15v-4h8m-3-3 3 3-3 3"/></symbol>
  </svg>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="TripPilot home"><span>TRIP<span class="slash">/</span>PILOT</span></a>
      <button class="mobile-back" id="mobile-back" type="button"><svg class="icon"><use href="#i-back"/></svg>BACK</button>
      <button class="my-trips" id="my-trips" type="button" hidden>Trips <span id="trip-count"></span></button>
    </header>

    <main>
      <section class="home-view" id="home-view" aria-labelledby="home-title">
        <h1 id="home-title">Where to<span class="home-punctuation">?</span></h1>
        <div class="search-block">
          <label class="sr-only" for="destination">Search for a destination</label>
          <div class="search-field home-search"><svg class="icon"><use href="#i-search"/></svg><input id="destination" type="search" role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" autocomplete="off" placeholder="City, region, or place" spellcheck="false"></div>
          <div class="suggestions" id="suggestions" role="listbox" hidden></div>
        </div>
        <p class="status" id="home-status" role="status" aria-live="polite"></p>
        <div class="recent" id="recent" hidden><div class="section-label">Your trips</div><div class="recent-items" id="recent-items"></div></div>
      </section>

      <section class="workspace" id="workspace" hidden aria-label="Trip planner">
        <div class="destination-hero" id="destination-hero">
          <div class="hero-art" aria-hidden="true"><svg viewBox="0 0 900 180" preserveAspectRatio="xMidYMid slice"><path class="hero-terrain" d="M500 180 660 24l90 70 68-44 82 80v50Z"/><path class="hero-trail" d="M-20 156C150 170 240 24 390 48S535 178 685 93 820 5 940 32"/></svg></div>
          <div class="hero-gallery" id="hero-gallery"></div><div class="hero-photo-shade" aria-hidden="true"></div>
          <div class="trip-title-wrap"><h1 id="trip-heading"><button id="edit-trip-title" type="button" aria-label="Edit trip title"><span id="trip-title"></span><svg class="icon"><use href="#i-edit"/></svg></button></h1><input id="trip-title-input" maxlength="120" aria-label="Trip title" hidden><p id="trip-address" hidden></p></div>
          <button class="hero-date" id="edit-dates" type="button"><svg class="icon"><use href="#i-calendar"/></svg><span id="trip-dates">Add dates</span></button>
          <div class="hero-top"><button class="more-button" id="trip-menu-button" type="button" aria-label="Trip options"><svg class="icon"><use href="#i-more"/></svg></button><div class="trip-menu" id="trip-menu" hidden><button id="delete-trip" type="button">Delete trip</button></div></div>
          <button id="back-button" type="button" hidden aria-label="Back to trips"></button>
        </div>
        <div class="route-bar" id="route-bar"><div class="route-list" id="route-list" aria-label="Trip destinations"></div><button class="route-add" id="add-stop" type="button"><svg class="icon"><use href="#i-plus"/></svg> Add stop</button><button class="route-edit" id="edit-route" type="button" aria-label="Edit route"><svg class="icon"><use href="#i-edit"/></svg></button></div>
        <div class="route-search" id="route-search" hidden><label class="sr-only" for="stop-search">Find another destination</label><div class="search-field"><svg class="icon"><use href="#i-search"/></svg><input id="stop-search" type="search" role="combobox" aria-autocomplete="list" aria-controls="stop-suggestions" aria-expanded="false" autocomplete="off" placeholder="Add a city or region" spellcheck="false"></div><div class="suggestions" id="stop-suggestions" role="listbox" hidden></div></div>
        <div class="date-picker" id="edit-date-picker" hidden aria-label="Choose trip dates">
          <div class="date-presets"><button type="button" data-date-preset="weekend">This weekend</button><button type="button" data-date-preset="next-week">Next week</button></div>
          <div class="date-summary" id="date-summary" aria-live="polite"></div>
          <div class="calendar-head"><button type="button" id="previous-month" aria-label="Previous month"><svg class="icon"><use href="#i-back"/></svg></button><strong id="calendar-month"></strong><button type="button" id="next-month" aria-label="Next month"><svg class="icon"><use href="#i-arrow"/></svg></button></div>
          <div class="calendar-grid" id="calendar-grid" aria-label="Trip date calendar"></div>
          <p class="calendar-message" id="calendar-message" role="status" aria-live="polite"></p>
          <div class="calendar-actions"><button id="clear-dates" type="button">Close</button><button id="save-dates" type="button">Save dates <svg class="icon"><use href="#i-arrow"/></svg></button></div>
        </div>
        <nav class="workspace-nav" aria-label="Trip navigation"><button type="button" data-workspace-view="itinerary" aria-pressed="true"><svg class="icon"><use href="#i-list"/></svg>Itinerary</button><button type="button" data-workspace-view="explore" aria-pressed="false"><svg class="icon"><use href="#i-map"/></svg>Explore</button><button type="button" data-workspace-view="transportation" aria-pressed="false"><svg class="icon"><use href="#i-plane"/></svg>Travel</button></nav>
        <div class="trip-body" id="plan-controls" data-view="itinerary">
          <section class="plan-panel" id="plan-panel" aria-label="Itinerary">
            <div class="panel-heading"><span id="place-count"></span><button type="button" id="add-plan" class="small-action" aria-label="Add a plan"><svg class="icon"><use href="#i-plus"/></svg></button></div>
            <div class="itinerary-toggle" role="group" aria-label="Itinerary view"><button type="button" data-plan-mode="list" aria-pressed="true"><svg class="icon"><use href="#i-list"/></svg>List</button><button type="button" data-plan-mode="calendar" aria-pressed="false"><svg class="icon"><use href="#i-calendar"/></svg>Calendar</button><button type="button" data-plan-mode="day" aria-pressed="false"><svg class="icon"><use href="#i-day"/></svg>Day</button></div>
            <div class="day-tabs" id="day-tabs" role="tablist" aria-label="Trip days"></div>
            <div class="day-content" id="day-content"></div>
          </section>
          <section class="discover-panel" id="discover-panel" aria-label="Discover places" hidden>
            <div class="panel-heading"><span id="add-to-day-label" hidden></span></div>
            <label class="explore-day"><svg class="icon"><use href="#i-calendar"/></svg><select id="explore-day" aria-label="Day for discovered places"></select></label>
            <div class="nearby-filters" role="group" aria-label="Nearby places"><button type="button" data-nearby="see">Sights</button><button type="button" data-nearby="eat">Food</button><button type="button" data-nearby="stay">Hotels</button><button type="button" data-nearby="nature">Outdoors</button><button type="button" data-nearby="culture">Culture</button></div>
            <div class="add-block"><label class="sr-only" for="place-search">Search for a place</label><div class="search-field place-search"><svg class="icon"><use href="#i-search"/></svg><input id="place-search" type="search" role="combobox" aria-autocomplete="list" aria-controls="place-suggestions" aria-expanded="false" autocomplete="off" placeholder="Find a place" spellcheck="false"></div><div class="suggestions" id="place-suggestions" role="listbox" hidden></div></div>
            <div class="nearby-results" id="nearby-results" aria-live="polite"></div>

          </section>
          <section class="transport-panel" id="transport-panel" aria-label="Transportation" hidden><div class="panel-heading"><div class="section-label">Flights & trains</div><button type="button" id="add-transport" class="small-action" aria-label="Add flight or train"><svg class="icon"><use href="#i-plus"/></svg></button></div><div id="transport-content"></div></section>
          <section class="map-column" id="map-column" aria-label="Destination map"><div class="map-heading"><div class="section-label">MAP</div><span id="map-caption"></span></div><div class="map-frame"><button type="button" id="search-map-area" class="search-map-area" hidden>Search this area</button><div id="map" class="google-map"></div><div class="map-loading" id="map-loading"><span class="spinner"></span>Loading map</div></div></section>
        </div>
        <p class="status trip-status" id="trip-status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>
  <dialog id="day-preview" class="day-preview" aria-labelledby="day-preview-title">
    <div class="day-preview-top"><div class="preview-date-stamp" aria-hidden="true"><span id="day-preview-month"></span><strong id="day-preview-number"></strong></div><div><h2 id="day-preview-title"></h2><p id="day-preview-context"></p></div><button id="close-day-preview" type="button" class="small-action" aria-label="Close day preview"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <div id="day-preview-events" class="day-preview-events"></div>
    <button id="open-preview-day" type="button" class="primary-action">View day<svg class="icon"><use href="#i-arrow"/></svg></button>
  </dialog>
  <dialog id="plan-dialog" class="editor-dialog plan-sheet" aria-label="Plan details">
    <div class="sheet-top"><span id="plan-dialog-kind" hidden></span><button type="button" class="small-action" data-close-dialog aria-label="Close plan details"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <label class="sr-only" for="plan-name">Plan name</label><input id="plan-name" class="editable-title" maxlength="160" placeholder="What would you like to do?" autocomplete="off">
    <div id="plan-place-details" class="place-details"></div>
    <div class="sheet-day-chips" id="plan-day-chips" role="group" aria-label="Move plan to day"></div>
    <div class="plan-tools"><button type="button" id="plan-time-button" class="detail-chip">Any time</button><button type="button" id="plan-booked" class="detail-chip" aria-pressed="false">Reservation</button><button type="button" id="plan-note-button" class="detail-chip">Note</button><button type="button" id="plan-location-button" class="detail-chip">Place</button><button type="button" id="plan-type-button" class="detail-chip">Activity</button></div>
    <div id="plan-location-picker" class="add-block" hidden><label class="sr-only" for="plan-location-search">Find plan location</label><div class="search-field place-search"><svg class="icon"><use href="#i-search"/></svg><input id="plan-location-search" type="search" role="combobox" aria-autocomplete="list" aria-controls="plan-location-suggestions" aria-expanded="false" autocomplete="off" placeholder="Find a restaurant, hotel, or place"></div><div id="plan-location-suggestions" class="suggestions" role="listbox" hidden></div></div>
    <div id="plan-time-controls" class="inline-time" hidden><label>Local time<input id="plan-time" type="time"></label><button type="button" id="plan-time-clear" class="quiet-action">Flexible</button><details><summary>Time zone</summary><input id="plan-zone" list="time-zones" aria-label="Plan time zone"></details></div>
    <div id="plan-type-choices" class="sheet-day-chips" role="group" aria-label="Plan type" hidden></div>
    <label class="optional-detail" id="plan-reference-wrap" hidden>Booking reference<input id="plan-reference" maxlength="160" placeholder="Optional"></label>
    <label class="optional-detail" id="plan-note-wrap" hidden>Note<textarea id="plan-notes" maxlength="4000" rows="3"></textarea></label>
    <p id="plan-error" class="editor-error" role="alert"></p>
    <div class="editor-actions"><button type="button" id="delete-plan" class="quiet-action" hidden>Remove</button><button type="button" id="plan-done" class="primary-action">Done</button></div>
  </dialog>
  <dialog id="place-dialog" class="editor-dialog plan-sheet" aria-labelledby="place-dialog-title"><div class="sheet-top"><button type="button" class="small-action" data-close-dialog aria-label="Close place details"><svg class="icon"><use href="#i-close"/></svg></button></div><h2 id="place-dialog-title"></h2><div id="discovery-place-details" class="place-details"></div><div class="sheet-day-chips" id="discovery-day-chips" role="group" aria-label="Day to add place"></div><p id="place-dialog-status" role="status"></p><button type="button" id="add-discovery-place" class="primary-action">Add to day</button></dialog>
  <dialog id="transport-dialog" class="editor-dialog transport-dialog" aria-labelledby="transport-dialog-title"><form id="transport-form"><div class="editor-heading"><h2 id="transport-dialog-title">Add flight or train</h2><button type="button" class="small-action" data-close-dialog aria-label="Close transportation editor"><svg class="icon"><use href="#i-close"/></svg></button></div><div class="editor-pair"><label>Type<select name="mode"><option>Flight</option><option>Train</option></select></label><label>Number<input id="service-number" autocomplete="off" name="service_id" required maxlength="40" placeholder="Flight or train number"></label></div><div id="flight-results" class="flight-results" aria-live="polite" hidden></div><div class="transport-legs"><section><h3>Departure</h3><div class="transport-search"><label>Airport or station<input id="departure-search" name="departure_location" required maxlength="240" role="combobox" aria-controls="departure-suggestions" aria-autocomplete="list" aria-expanded="false" autocomplete="off"></label><div id="departure-suggestions" class="suggestions" role="listbox" hidden></div></div><div class="editor-pair"><label>Date<select name="departure_date" required></select></label><label>Local time<input name="departure_time" type="time" required></label></div><label>Time zone<input name="departure_time_zone" list="time-zones" required></label></section><section><h3>Arrival</h3><div class="transport-search"><label>Airport or station<input id="arrival-search" name="arrival_location" required maxlength="240" role="combobox" aria-controls="arrival-suggestions" aria-autocomplete="list" aria-expanded="false" autocomplete="off"></label><div id="arrival-suggestions" class="suggestions" role="listbox" hidden></div></div><div class="editor-pair"><label>Date<select name="arrival_date" required></select></label><label>Local time<input name="arrival_time" type="time" required></label></div><label>Time zone<input name="arrival_time_zone" list="time-zones" required></label></section></div><details><summary>Notes</summary><textarea name="notes" maxlength="4000" rows="2" aria-label="Transportation notes"></textarea></details><p class="editor-error" id="transport-error" role="alert"></p><div class="editor-actions"><button type="button" id="delete-transport" class="quiet-action" hidden>Remove</button><button type="submit" class="primary-action">Save</button></div></form></dialog>
  <datalist id="time-zones"></datalist>
</body>
</html>
